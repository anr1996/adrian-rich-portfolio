# application.yml: shared settings for every environment.
# Real values come from environment variables. Locally they are read from
# the project's .env file, so no password appears in this committed file.

spring:
  application:
    name: portfolio
  
  # Load ../.env (the repo root, when the app runs from backend/) as a 
  # properties file. "optional:" means: skip it if missing, as in production.
  config:
   import: optional:file:../.env[.properties]
  
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Close the database connection when the service layer finishes,
    # not after the HTTP response is written.
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
