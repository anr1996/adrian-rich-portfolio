# ci.yml: build and test the backend on every pull request and every push to main.
name: CI

on:
    pull_request:
    push:
        branches: [main]
    
    jobs:
        backend:    
            name: Backend tests
            runs-on: ubuntu-latest
            defaults:
                run:
                    working-directory: backend
            
            steps:
                - name: Check out the code
                  uses: actions/checkout@v6
            
                - name: Set up Java 25
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '25'
                    cache: maven
        
                - name: Build and run all tests
                  run: ./mvnw -B verify
